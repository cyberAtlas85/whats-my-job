@import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap');
.sp{--clay:#C8834A;--clay2:#A96A38;--grass:#2F6B3A;--grass2:#245631;--chalk:#F5F1E6;--ink:#1B2A3B;--ink2:#4A5A6C;--gold:#F3C24B;--red:#C8443B;
 font-family:'Barlow',system-ui,sans-serif;color:var(--ink);background:var(--chalk);min-height:100vh;margin:0 auto;padding:0 0 40px;max-width:480px}
@media (min-width:900px){.sp{max-width:none;padding:0 32px 40px}.sp .wrap{display:grid;grid-template-columns:minmax(380px,520px) 1fr;gap:32px;align-items:start}.sp .card{margin:16px 0 0;padding:28px}.sp .card h2{font-size:42px}.sp .card ol{font-size:24px;line-height:1.35}.sp .card .scen{font-size:18px}.sp .why{font-size:19px}.sp .alert{font-size:19px}.sp .forces{font-size:16px}.sp h1{font-size:34px}.sp .chip{font-size:18px;padding:9px 16px}.sp .lbl{font-size:18px}.sp .quiz{margin:16px 0 0}.sp .grade{margin:10px 0 0}.sp .foot{padding-left:0}.sp .card:empty{display:none}}
.sp *{box-sizing:border-box}
.sp h1,.sp h2,.sp .disp{font-family:'Barlow Semi Condensed','Barlow',sans-serif}
.sp .top{display:flex;align-items:baseline;justify-content:space-between;padding:14px 16px 6px}
.sp h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.01em}
.sp .mode{display:flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;font-family:'Barlow Semi Condensed';font-weight:700;font-size:14px}
.sp .mode button{background:none;border:0;padding:6px 12px;color:var(--ink);cursor:pointer;font:inherit}
.sp .mode button.on{background:var(--ink);color:var(--chalk)}
.sp .field{padding:0 8px}
.sp svg{width:100%;display:block;touch-action:manipulation}
.sp .zone{cursor:pointer}
.sp .zone circle{fill:rgba(245,241,230,.88);stroke:var(--ink);stroke-width:1.5;transition:transform .12s}
.sp .zone.dim circle{fill:rgba(245,241,230,.35);stroke:rgba(27,42,59,.3)}
.sp .zone.dim text{fill:rgba(27,42,59,.35)}
.sp .zone.on circle{fill:var(--gold);stroke:var(--ink);stroke-width:2.5}
.sp .zone text{font-family:'Barlow Semi Condensed';font-weight:700;font-size:11px;fill:var(--ink);text-anchor:middle;pointer-events:none}
.sp .base{cursor:pointer}
.sp .base rect{fill:var(--chalk);stroke:var(--ink);stroke-width:1.5}
.sp .base.occ rect{fill:var(--red);stroke:var(--chalk)}
.sp .caption{font-size:13px;color:var(--ink2);padding:4px 16px 0;min-height:18px}
.sp .row{padding:10px 16px 0}
.sp .lbl{font-family:'Barlow Semi Condensed';font-weight:700;font-size:15px;margin:0 0 6px}
.sp .chips{display:flex;flex-wrap:wrap;gap:6px}
.sp .chip{font-family:'Barlow Semi Condensed';font-weight:700;font-size:15px;border:2px solid var(--ink);background:none;color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:40px}
.sp .chip.on{background:var(--ink);color:var(--chalk)}
.sp .chip.grass.on{background:var(--grass);border-color:var(--grass)}
.sp .chip:disabled{opacity:.3;cursor:default}
.sp .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sp .card{margin:16px 12px 0;background:var(--ink);color:var(--chalk);border-radius:14px;padding:16px 16px 14px}
.sp .card .scen{font-size:13px;color:#B8C4D2;margin:0 0 4px}
.sp .card h2{font-size:26px;font-weight:800;line-height:1.05;margin:0 0 12px;color:var(--gold)}
.sp .card ol{margin:0;padding:0 0 0 22px;font-size:16px;line-height:1.35}
.sp .card li{margin:0 0 8px}
.sp .card li::marker{font-family:'Barlow Semi Condensed';font-weight:800;color:var(--gold)}
.sp .why{margin:12px 0 0;padding:10px 12px;border-left:3px solid var(--clay);font-size:14px;line-height:1.4;color:#DCE3EA;background:rgba(255,255,255,.05);border-radius:0 8px 8px 0}
.sp .alert{margin:10px 0 0;padding:9px 12px;background:var(--red);color:var(--chalk);border-radius:8px;font-size:14px;font-weight:600;line-height:1.35}
.sp .forces{font-size:13px;color:#B8C4D2;margin:12px 0 0}
.sp .quiz{margin:16px 12px 0;text-align:center}
.sp .big{width:100%;font-family:'Barlow Semi Condensed';font-weight:800;font-size:20px;background:var(--gold);color:var(--ink);border:0;border-radius:12px;padding:16px;cursor:pointer;min-height:56px}
.sp .big.ghost{background:none;border:2px solid var(--ink);color:var(--ink);font-size:17px;margin-top:8px;min-height:48px;padding:11px}
.sp .grade{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 12px 0}
.sp .grade button{font-family:'Barlow Semi Condensed';font-weight:800;font-size:18px;border-radius:12px;border:0;padding:14px;cursor:pointer;min-height:52px}
.sp .grade .ok{background:var(--grass);color:var(--chalk)}
.sp .grade .no{background:var(--clay);color:var(--chalk)}
.sp .tally{text-align:center;font-family:'Barlow Semi Condensed';font-weight:700;font-size:15px;color:var(--ink2);margin-top:10px}
